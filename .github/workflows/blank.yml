name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
        with:
          repository: pzhlkj6612/forked-install-qt-action
          ref: 5d1e9bcbe34cfd913a267c676af25d4a0169263d

      - run: |
          cd ./action
          npm ci
          npm run build

      # See the root "action.yml" file.
      - name: Use local built internal action (hack)
        run: |
          sed -i.bak 's|uses: $/action|uses: ./action|' action.yml
          diff -u action.yml.bak action.yml || true
          git status --porcelain
        shell: bash
        
      - name: Install Qt
        uses: ./
